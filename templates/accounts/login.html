{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In - CraveX{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card bg-dark bg-opacity-75 border-secondary rounded-4 p-4 p-md-5 shadow-lg">
                    <div class="text-center mb-4">
                        <h2 class="text-white brand-font mb-1"><i class="fa-solid fa-right-to-bracket text-danger me-2"></i> Welcome Back</h2>
                        <p class="text-muted small">Sign in to access your CraveX account & track orders</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted">Username</label>
                            <input type="text" name="username" class="form-control custom-input" placeholder="Enter your username" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted">Password</label>
                            <input type="password" name="password" class="form-control custom-input" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-cravex btn-lg w-100 py-3 mb-3">
                            Log In <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top border-secondary">
                        <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-danger fw-bold text-decoration-none">Sign Up Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
